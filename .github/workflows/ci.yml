name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - name: Guardar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
